scale_later_agent_dictionary:
- capability: object_storage
  examples:
  - S3
  - R2
  - MinIO
  do_not_build_now: true
  trigger: first real client durable uploads, multi-instance deployment, large media
    volume, or compliance/backup requirement
  prepared_boundary: BlobStore
- capability: shared_cache_and_locks
  examples:
  - Redis
  do_not_build_now: true
  trigger: multiple app instances or measured cache/distributed-lock/rate-limit need
  prepared_boundary: Cache/Lock adapter
- capability: dedicated_queue
  examples:
  - BullMQ
  - Redis queue
  do_not_build_now: true
  trigger: measured Postgres job backlog/throughput bottleneck
  prepared_boundary: JobRunner
- capability: durable_workflow_engine
  examples:
  - Temporal
  do_not_build_now: true
  trigger: multi-hour/day cross-system workflows with many callbacks/approvals become
    difficult or risky to maintain in DB state machine
  prepared_boundary: WorkflowStore
- capability: event_streaming
  examples:
  - Kafka
  - Redis Streams
  do_not_build_now: true
  trigger: high event volume plus multiple independent consumers/replay requirement
  prepared_boundary: transactional outbox
- capability: separate_vector_database
  examples:
  - specialist vector DB
  do_not_build_now: true
  trigger: pgvector measured as a production bottleneck
  prepared_boundary: retrieval interface
- capability: kubernetes_microservices
  examples:
  - Kubernetes
  do_not_build_now: true
  trigger: team ownership or independent scaling/deployment requirements justify it
  prepared_boundary: modular monolith boundaries
