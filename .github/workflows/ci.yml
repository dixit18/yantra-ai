# P1-CICD-009 — the PR gate. Every step runs the same command a developer runs
# locally (see README.md); no CI-only scripts. Live-DB tests skip without
# DATABASE_URL, so forks stay green; migration discovery is covered by unit
# tests. Playwright installs its own Chromium; the e2e webServer boots the
# production build it just made.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.13.1
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, cached store)
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests (live DB tests skip without secrets)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @yantra/web exec playwright install --with-deps chromium

      - name: E2E (3D-perfect gate)
        run: pnpm e2e

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
